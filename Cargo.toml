[package]
name = "miniserve"
version = "0.29.0"
description = "For when you really just want to serve some files over HTTP right now!"
authors = ["Sven-Hendrik Haase <svenstaro@gmail.com>", "Boastful Squirrel <boastful.squirrel@gmail.com>"]
repository = "https://github.com/svenstaro/miniserve"
license = "MIT"
readme = "README.md"
keywords = ["serve", "http-server", "static-files", "http", "server"]
categories = ["command-line-utilities", "network-programming", "web-programming::http-server"]
edition = "2021"
resolver = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 'z'
panic = 'abort'
strip = true

[dependencies]
actix-cors = "0.7"
actix-files = "0.6.10"
actix-multipart = "0.7"
actix-session = { version = "0.11", features = ["cookie-session"] }
actix-web = { version = "4", features = ["macros", "compress-brotli", "compress-gzip", "compress-zstd"], default-features = false }
actix-web-httpauth = "0.8"
aes = "0.9"
alphanumeric-sort = "1"
anyhow = "1"
bytes = "1"
bytesize = "2"
chrono = "0.4"
chrono-humanize = "0.2"
cipher = "0.5"
clap = { version = "4", features = ["derive", "cargo", "wrap_help", "deprecated", "env"] }
cookie = "0.18.1"
clap_complete = "4"
clap_mangen = "0.3"
colored = "3"
comrak = { version = "0.52", default-features = false }
dav-server = { version = "0.11", features = ["actix-compat"] }
ecb = "0.2"
fast_qr = { version = "0.13", features = ["svg"] }
futures = "0.3"
grass = { version = "0.13", features = ["macro"], default-features = false }
hex = "0.4"
httparse = "1"
if-addrs = "0.15"
jwt-compact = "0.8"
libflate = "2"
log = "0.4"
maud = "0.27"
md2_digest = "1.0"
md5 = "0.8"
mime = "0.3"
mio = "1.2.0"
mongodb = "3"
nanoid = "0.5"
nix = { version = "0.31.2", features = ["user", "fs"] }
percent-encoding = "2"
port_check = "0.3"
rand_core = "0.10"
rhai = "1"
rc4 = "0.2"
regex = "1"
rocket-session-store = "0.2.1"
rusqlite = "0.37.0"
rustls = { version = "0.23", features = ["ring"], optional = true, default-features = false }
rustls-pemfile = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
ldap3 = "0.11"
simple-ldap = "8.0.1"
simplelog = "0.12"
arangors = "0.6"
oracle = "0.6"
openssl = "0.10"
surf = "2.3"
sxd-document = "0.3"
sxd-xpath = "0.4"
socket2 = "0.6"
strum = { version = "0.28", features = ["derive"] }
tar = "0.4"
tempfile = "3.23.0"
thiserror = "2"
tower-http = { version = "0.6", features = ["cors"] }
tokio = { version = "1.52.1", features = ["fs", "macros"] }
wyrand = "0.4"
wasmtime = "38"
zip = { version = "7", default-features = false }

[features]
default = ["tls"]
# This feature allows us to use rustls only on architectures supported by ring.
# See also https://github.com/briansmith/ring/issues/1182
# and https://github.com/briansmith/ring/issues/562
# and https://github.com/briansmith/ring/issues/1367
tls = ["rustls", "rustls-pemfile", "actix-web/rustls-0_23"]

[dev-dependencies]
assert_cmd = "2"
assert_fs = "1"
predicates = "3"
pretty_assertions = "1.2"
regex = "1"
reqwest = { version = "0.12", features = ["blocking", "multipart", "rustls-tls"], default-features = false }
reqwest_dav = "0.3"
rstest = "0.26"
select = "0.6"
url = "2"

[target.'cfg(not(windows))'.dev-dependencies]
# fake_tty does not support Windows for now
fake-tty = "0.3.1"
